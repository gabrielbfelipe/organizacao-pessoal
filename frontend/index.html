<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />

    <style>
      /* ── Card da próxima escala: o destaque do painel ── */
      .escala-card__celebracao {
        font-size: 1.75rem;
        margin: 0 0 4px;
      }

      .escala-card__quando {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .escala-card__contagem {
        text-align: right;
        padding-left: 16px;
      }

      .escala-card__relogio {
        font-family: var(--fonte-titulo);
        font-size: 2rem;
        font-weight: 600;
        line-height: 1.05;
        color: var(--gold-texto);
        font-variant-numeric: tabular-nums;
      }

      .escala-card__relogio-rotulo {
        font-size: 0.76rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .escala-card__rodape {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .escala-card__obs {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        margin: 14px 0 0;
        font-size: 0.86rem;
        color: var(--muted);
      }

      .escala-card__obs .icone {
        width: 15px;
        height: 15px;
        margin-top: 3px;
        flex-shrink: 0;
      }

      /* ── Blocos que as próximas fases vão preencher ── */
      .pendentes__item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.88rem;
      }

      .pendentes__item:last-child {
        border-bottom: 0;
      }

      .pendentes__item .icone {
        width: 16px;
        height: 16px;
        opacity: 0.6;
      }

      @media (max-width: 560px) {
        .escala-card__contagem {
          text-align: left;
          padding: 12px 0 0;
        }
        .escala-card__celebracao {
          font-size: 1.4rem;
        }
      }
    </style>

    <script>
      // Antes da primeira pintura, para não piscar o tema claro.
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando o Ordo...</div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
