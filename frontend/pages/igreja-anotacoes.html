<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anotações da igreja · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />

    <script>
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando...</div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
    <script type="module" src="/js/pages/igreja-anotacoes.js"></script>
  </body>
</html>
