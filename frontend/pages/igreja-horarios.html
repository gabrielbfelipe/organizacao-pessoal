<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horários fixos · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />

    <script>
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>
    <style>
      .grade {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 14px;
        align-items: start;
      }

      .dia {
        padding: 15px 16px;
      }

      .dia--hoje {
        border-color: var(--gold-texto);
        box-shadow: var(--shadow), inset 0 0 0 1px var(--gold-fraco);
      }

      .dia__nome {
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 11px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .dia--hoje .dia__nome {
        color: var(--gold-texto);
      }

      .horario {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 0;
      }

      .horario__hora {
        font-family: var(--fonte-titulo);
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--titulo);
        min-width: 46px;
        font-variant-numeric: tabular-nums;
      }

      .horario__tipo {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .horario[data-tipo="missa"] .horario__tipo {
        background: var(--gold);
      }
      .horario[data-tipo="confissao"] .horario__tipo {
        background: var(--lit-roxo);
      }
      .horario[data-tipo="adoracao"] .horario__tipo {
        background: var(--success);
      }

      .horario__texto {
        font-size: 0.86rem;
      }

      .horario__local {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .horario__excluir {
        opacity: 0;
        transition: opacity var(--transicao-rapida);
      }

      .horario:hover .horario__excluir {
        opacity: 1;
      }

      .dia__vazio {
        font-size: 0.82rem;
        color: var(--muted);
        padding: 6px 0;
      }
    </style>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando...</div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/pages/igreja-horarios.js"></script>
  </body>
</html>
