<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leituras · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />

    <script>
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>
    <style>
      .livros {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 14px;
        align-items: start;
      }

      .livro {
        padding: 16px 17px;
      }

      .livro__titulo {
        font-family: var(--fonte-titulo);
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--titulo);
        margin: 0 0 2px;
        line-height: 1.25;
      }

      .livro__autor {
        font-size: 0.83rem;
        color: var(--muted);
        margin: 0 0 12px;
      }

      .livro__progresso-texto {
        display: flex;
        justify-content: space-between;
        font-size: 0.76rem;
        color: var(--muted);
        margin-bottom: 5px;
      }

      .livro__rodape {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 13px;
        padding-top: 11px;
        border-top: 1px solid var(--border);
      }

      .nota-livro {
        padding: 11px 13px;
        border-left: 3px solid var(--border-forte);
        background: var(--card-sutil);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        margin-bottom: 9px;
      }

      .nota-livro[data-tipo="citacao"] {
        border-left-color: var(--gold-texto);
        font-family: var(--fonte-titulo);
        font-size: 1.05rem;
        font-style: italic;
      }

      .nota-livro__meta {
        font-size: 0.73rem;
        color: var(--muted);
        margin-top: 5px;
        font-family: var(--fonte-ui);
        font-style: normal;
      }
    </style>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando...</div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/pages/igreja-leituras.js"></script>
  </body>
</html>
