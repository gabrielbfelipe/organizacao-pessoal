<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Materiais de estudo · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />

    <script>
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>
    <style>
      .temas {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .materiais {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
        align-items: start;
      }

      .material {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 15px;
      }

      .material__icone {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-sm);
        background: var(--gold-fraco);
        color: var(--gold-texto);
        flex-shrink: 0;
      }

      .material__icone .icone {
        width: 19px;
        height: 19px;
      }

      .material__nome {
        font-weight: 500;
        font-size: 0.9rem;
        line-height: 1.3;
        word-break: break-word;
      }

      .material__meta {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 3px;
      }

      .material__acoes {
        display: flex;
        gap: 2px;
        margin-top: 8px;
      }

      /* ── Visualizador de PDF ── */
      .visor {
        position: fixed;
        inset: 0;
        z-index: 400;
        background: var(--sobreposicao);
        display: flex;
        flex-direction: column;
        padding: 20px;
        animation: aparecer var(--transicao) both;
      }

      .visor__topo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius) var(--radius) 0 0;
      }

      .visor__quadro {
        flex: 1;
        border: 1px solid var(--border);
        border-top: 0;
        border-radius: 0 0 var(--radius) var(--radius);
        background: var(--card);
        overflow: auto;
        display: grid;
        place-items: start center;
        padding: 16px;
      }

      .visor__quadro canvas {
        max-width: 100%;
        box-shadow: var(--shadow-media);
        margin-bottom: 14px;
      }
    </style>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando...</div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.9.155/build/pdf.min.mjs"
            type="module"></script>
    <script type="module" src="/js/pages/igreja-materiais.js"></script>
  </body>
</html>
