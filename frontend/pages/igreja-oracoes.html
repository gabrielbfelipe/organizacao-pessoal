<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orações · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />

    <script>
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>
    <style>
      .oracoes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
        gap: 14px;
        align-items: start;
      }

      .oracao {
        padding: 16px 17px;
        cursor: pointer;
        transition: border-color var(--transicao), transform var(--transicao-rapida);
      }

      .oracao:hover {
        border-color: var(--gold-texto);
        transform: translateY(-2px);
      }

      .oracao__titulo {
        font-family: var(--fonte-titulo);
        font-size: 1.18rem;
        font-weight: 600;
        color: var(--titulo);
        margin: 0 0 7px;
        padding-right: 30px;
      }

      .oracao__favorita {
        position: absolute;
        top: 14px;
        right: 14px;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--muted);
        padding: 3px;
      }

      .oracao__favorita[aria-pressed="true"] {
        color: var(--gold-texto);
      }

      .oracao__favorita .icone {
        width: 17px;
        height: 17px;
      }

      .oracao-envolve {
        position: relative;
      }

      /* ── Novena em andamento ── */
      .novena {
        padding: 15px 16px;
      }

      .novena__contador {
        font-family: var(--fonte-titulo);
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--gold-texto);
      }

      /* ── Modo Rezar ── */
      .rezar {
        position: fixed;
        inset: 0;
        z-index: 400;
        background: #0e131b;
        color: #e9e5db;
        display: flex;
        flex-direction: column;
        animation: aparecer var(--transicao) both;
      }

      .rezar__topo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      }

      .rezar__titulo {
        font-family: var(--fonte-titulo);
        font-size: 1.4rem;
        font-weight: 600;
        color: #fff;
        margin: 0;
      }

      .rezar__acao {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #c2ccda;
        border-radius: var(--radius-sm);
        padding: 6px 11px;
        cursor: pointer;
        font-size: 0.84rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background var(--transicao-rapida);
      }

      .rezar__acao:hover {
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }

      .rezar__texto {
        flex: 1;
        overflow-y: auto;
        padding: 42px 24px 80px;
        font-family: var(--fonte-titulo);
        font-size: var(--rezar-fonte, 24px);
        line-height: 1.75;
        white-space: pre-wrap;
        max-width: 42em;
        margin: 0 auto;
        width: 100%;
        text-align: center;
      }

      .rezar__rodape {
        padding: 14px 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 0.82rem;
        color: #8d97a6;
      }
    </style>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando...</div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/pages/igreja-oracoes.js"></script>
  </body>
</html>
