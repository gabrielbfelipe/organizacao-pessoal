<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarefas · Ordo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/ordo.css" />

    <script>
      try {
        const t = localStorage.getItem("ordo:tema");
        document.documentElement.setAttribute(
          "data-theme",
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        );
      } catch {}
    </script>

    <style>
      /* ─────────────── Kanban ─────────────── */
      .kanban {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        align-items: start;
      }

      .coluna {
        background: var(--card-sutil);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        min-height: 220px;
      }

      .coluna__cabecalho {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      .coluna__titulo {
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .coluna__marca {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .coluna[data-status="a_fazer"] .coluna__marca {
        background: var(--muted);
      }
      .coluna[data-status="fazendo"] .coluna__marca {
        background: var(--gold);
      }
      .coluna[data-status="feito"] .coluna__marca {
        background: var(--success);
      }

      .coluna__lista {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 60px;
      }

      /* ─────────────── Cartão ─────────────── */
      .tarefa {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--border-forte);
        border-radius: var(--radius-sm);
        padding: 12px 13px;
        cursor: grab;
        box-shadow: var(--shadow);
        transition: box-shadow var(--transicao), transform var(--transicao-rapida);
      }

      .tarefa:hover {
        box-shadow: var(--shadow-media);
      }

      .tarefa:active {
        cursor: grabbing;
      }

      .tarefa[data-prioridade="alta"] {
        border-left-color: var(--danger-texto);
      }
      .tarefa[data-prioridade="media"] {
        border-left-color: var(--gold-texto);
      }
      .tarefa[data-prioridade="baixa"] {
        border-left-color: var(--border-forte);
      }

      .tarefa--feita .tarefa__titulo {
        text-decoration: line-through;
        color: var(--muted);
      }

      .tarefa__titulo {
        font-weight: 500;
        font-size: 0.92rem;
        line-height: 1.35;
        margin-bottom: 7px;
        word-break: break-word;
      }

      .tarefa__meta {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        font-size: 0.74rem;
        color: var(--muted);
      }

      .tarefa__meta .icone {
        width: 13px;
        height: 13px;
      }

      .tarefa__prazo--atrasado {
        color: var(--danger-texto);
        font-weight: 600;
      }

      .tarefa__tags {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .tag {
        padding: 1px 8px;
        border-radius: var(--radius-pill);
        background: var(--gold-fraco);
        color: var(--gold-texto);
        font-size: 0.7rem;
        font-weight: 500;
      }

      .tarefa__progresso {
        margin-top: 9px;
      }

      .tarefa__progresso-rotulo {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 4px;
      }

      /* Estados do SortableJS durante o arrasto */
      .arrastando {
        opacity: 0.4;
      }

      .fantasma {
        border-style: dashed;
        background: var(--gold-fraco);
      }

      /* ─────────────── Checklist no formulário ─────────────── */
      .checklist {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .checklist__item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checklist__item input[type="text"] {
        flex: 1;
      }

      .checklist__item input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--gold);
        flex-shrink: 0;
        cursor: pointer;
      }

      /* ─────────────── Tabela ─────────────── */
      .col-titulo {
        min-width: 240px;
      }

      .col-acoes {
        white-space: nowrap;
        text-align: right;
      }

      tr[data-feita="sim"] .col-titulo {
        text-decoration: line-through;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .kanban {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="carregando"><span class="girando"></span>Carregando...</div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/pages/tarefas.js"></script>
  </body>
</html>
